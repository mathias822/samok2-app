<title>Samøk 2 Øvingsapp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Enkelt og ryddig design. Farger samlet øverst, så de er lette å endre. */
:root {
  --bakgrunn: #f6f7f9;
  --kort: #ffffff;
  --tekst: #1f2937;
  --dempet: #6b7280;
  --linje: #e5e7eb;
  --hoved: #2563eb;
  --hoved-mork: #1d4ed8;
  --hoved-lys: #eff4ff;
  --ok: #059669;
  --ok-lys: #ecfdf5;
  --fare: #dc2626;
  --fare-lys: #fef2f2;
  --rutenett: #eef0f3;
  --felt: #ffffff;
  --felt-kant: #d1d5db;
  --info-kant: #bfdbfe;
  --advarsel-bg: #fff7ed;
  --advarsel-tekst: #9a3412;
  --ok-tekst: #065f46;
  --fare-tekst: #991b1b;
  --radius: 12px;
  --skygge: 0 1px 2px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.04);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bakgrunn: #0f1420; --kort: #171d2b; --tekst: #e6e9f0; --dempet: #9aa3b5; --linje: #2a3242;
    --hoved: #5b8cff; --hoved-mork: #8fb0ff; --hoved-lys: #1c2a4a; --ok: #10b981; --ok-lys: #0f2e26;
    --fare: #f87171; --fare-lys: #3a1a1d; --rutenett: #242b3a; --felt: #111725; --felt-kant: #374151;
    --info-kant: #2f4a7f; --advarsel-bg: #3a2a14; --advarsel-tekst: #fdba74; --ok-tekst: #6ee7b7; --fare-tekst: #fca5a5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bakgrunn: #0f1420; --kort: #171d2b; --tekst: #e6e9f0; --dempet: #9aa3b5; --linje: #2a3242;
  --hoved: #5b8cff; --hoved-mork: #8fb0ff; --hoved-lys: #1c2a4a; --ok: #10b981; --ok-lys: #0f2e26;
  --fare: #f87171; --fare-lys: #3a1a1d; --rutenett: #242b3a; --felt: #111725; --felt-kant: #374151;
  --info-kant: #2f4a7f; --advarsel-bg: #3a2a14; --advarsel-tekst: #fdba74; --ok-tekst: #6ee7b7; --fare-tekst: #fca5a5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bakgrunn);
  color: var(--tekst);
  font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  padding-bottom: 80px;
}
h1 { font-size: 1.75rem; margin: 0.4em 0 0.5em; }
h2 { font-size: 1.2rem; margin: 0 0 0.6em; }
h3 { font-size: 1.02rem; margin: 0.8em 0 0.4em; }
h4, h5 { margin: 0.8em 0 0.3em; }
a { color: var(--hoved); }
code { background: var(--bakgrunn); padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }

/* Toppmeny */
.topp {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  padding: 10px 24px; background: var(--kort); border-bottom: 1px solid var(--linje);
  position: sticky; top: 0; z-index: 10;
}
.logo { font-weight: 700; font-size: 1.1rem; color: var(--tekst); text-decoration: none; }
.logo span { font-weight: 400; color: var(--dempet); }
.meny { display: flex; gap: 2px; flex-wrap: wrap; }
.meny a { padding: 6px 12px; border-radius: 8px; color: var(--tekst); text-decoration: none; font-size: 0.95rem; }
.meny a:hover { background: var(--bakgrunn); }
.meny a.aktiv { background: var(--hoved-lys); color: var(--hoved-mork); font-weight: 600; }

.demo-banner { background: var(--advarsel-bg); color: var(--advarsel-tekst); border-bottom: 1px solid var(--linje); padding: 8px 24px; font-size: 0.92rem; text-align: center; }

main { max-width: 1150px; margin: 0 auto; padding: 16px 24px; }

/* Kort */
.kort { background: var(--kort); border: 1px solid var(--linje); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--skygge); }
.kort.tom { text-align: center; padding: 32px 20px; }
.dempet { color: var(--dempet); }
.liten-tekst { font-size: 0.85rem; }
.midt { text-align: center; }
.feiltekst { color: var(--fare); background: var(--fare-lys); padding: 10px 14px; border-radius: 8px; }
.rad-mellom { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.rad-mellom h1, .rad-mellom h2 { margin-bottom: 0.4em; }
.to-kolonner { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.to-kolonner > .kort { margin-bottom: 0; }
.to-kolonner + * { margin-top: 16px; }
.handlinger { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
.tilbake { display: inline-block; margin-top: 8px; text-decoration: none; }

/* Knapper */
.knapp {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; cursor: pointer;
  background: var(--hoved); color: white; padding: 9px 16px; border-radius: 9px; font: inherit; font-weight: 600;
  text-decoration: none; transition: background 0.15s;
}
.knapp:hover { background: var(--hoved-mork); }
.knapp:disabled { opacity: 0.5; cursor: not-allowed; }
.knapp.lys { background: var(--kort); color: var(--tekst); border-color: var(--linje); }
.knapp.lys:hover { background: var(--bakgrunn); }
.knapp.fare { background: var(--kort); color: var(--fare); border-color: var(--fare-lys); }
.knapp.fare:hover { background: var(--fare-lys); }
.knapp.ok { background: var(--ok); }
.knapp.ok:hover { background: #047857; }
.knapp.liten { padding: 4px 10px; font-size: 0.85rem; font-weight: 500; }

/* Skjemaer */
.felt { display: flex; flex-direction: column; gap: 4px; margin: 12px 0; font-weight: 500; }
input[type=text], input[type=search], input[type=number], select, textarea {
  font: inherit; padding: 8px 10px; border: 1px solid var(--felt-kant); border-radius: 8px; background: var(--felt); color: var(--tekst); width: 100%;
}
textarea { resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--hoved-lys); border-color: var(--hoved); }

/* Oversikt */
.statistikk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--kort); border: 1px solid var(--linje); border-radius: var(--radius); padding: 14px 16px; }
.stat strong { display: block; font-size: 1.6rem; }
.stat span { color: var(--dempet); font-size: 0.9rem; }
.temanett { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.tema { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--linje); border-radius: 9px; text-decoration: none; color: var(--dempet); font-size: 0.93rem; }
.tema.har { color: var(--tekst); border-color: var(--info-kant); background: var(--hoved-lys); }
.tema.valgt { outline: 2px solid var(--hoved); }
.tema small { white-space: nowrap; color: var(--dempet); }
.leveranseliste { list-style: none; padding: 0; margin: 0; }
.leveranseliste li { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linje); flex-wrap: wrap; }
.leveranseliste li:last-child { border-bottom: 0; }
.leveranseliste a { display: flex; flex-direction: column; text-decoration: none; color: var(--tekst); }
.leveranseliste a span { font-size: 0.88rem; }
.chip { display: inline-block; background: var(--hoved-lys); color: var(--hoved-mork); padding: 2px 10px; border-radius: 99px; font-size: 0.82rem; text-decoration: none; margin: 2px 0; }
.chips { margin-bottom: 16px; }

/* Lever */
.slippsone { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 32px; border: 2px dashed #cbd5e1; border-radius: var(--radius); cursor: pointer; text-align: center; background: var(--bakgrunn); }
.slippsone.over, .slippsone:hover { border-color: var(--hoved); background: var(--hoved-lys); }
.slipp-ikon { font-size: 2rem; }
.forhandsvisning { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.miniatyr { position: relative; width: 120px; display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem; word-break: break-all; }
.miniatyr img, .pdf-ikon { width: 120px; height: 150px; object-fit: cover; border-radius: 8px; border: 1px solid var(--linje); }
.pdf-ikon { display: grid; place-items: center; background: var(--fare-lys); color: var(--fare); font-weight: 700; }
.fjern { position: absolute; top: 4px; right: 4px; border: 0; background: rgba(0, 0, 0, 0.6); color: white; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; }
.laster { display: flex; align-items: center; gap: 12px; color: var(--dempet); margin-top: 12px; }
.spinner { width: 22px; height: 22px; border: 3px solid var(--linje); border-top-color: var(--hoved); border-radius: 50%; animation: snurr 0.8s linear infinite; flex-shrink: 0; }
@keyframes snurr { to { transform: rotate(360deg); } }

/* Side */
.sammendrag { font-size: 1.04rem; }
.poeng li { margin-bottom: 4px; }
.fil-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.fil-liste img { width: 100%; border-radius: 6px; border: 1px solid var(--linje); }
.fil-pdf { grid-column: 1 / -1; }
.begrepliste { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin: 0; }
.begrepliste > div { background: var(--bakgrunn); border-radius: 9px; padding: 12px; }
.begrepliste dt { font-weight: 700; }
.begrepliste dd { margin: 4px 0 0; }

/* Grafer */
.graf-kort { border-top: 1px solid var(--linje); padding-top: 12px; margin-top: 12px; }
.graf-kort:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.graf-kort h3 { margin-top: 0; }
.graf-innhold { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.plott { width: 100%; height: 430px; overflow: hidden; }
.kontroller { background: var(--bakgrunn); border-radius: 10px; padding: 12px; }
.glider { display: block; margin-bottom: 12px; font-size: 0.86rem; }
.glider-navn { display: block; font-weight: 500; margin-bottom: 2px; }
.glider-rad { display: flex; align-items: center; gap: 8px; }
.glider input[type=range] { flex: 1; accent-color: var(--hoved); }
.glider output { min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.graf-resultat { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 8px; align-items: start; }
.tabell-ramme { overflow-x: auto; min-width: 0; }
.nokkeltall { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
.nokkeltall th { text-align: right; color: var(--dempet); font-weight: 500; padding: 4px 8px; }
.nokkeltall td { padding: 5px 8px; border-top: 1px solid var(--linje); }
.nokkeltall .tall { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nokkeltall .endring { color: var(--hoved-mork); }
.forklaring { background: var(--hoved-lys); border-radius: 10px; padding: 10px 14px; }
.forklaring h4 { margin: 0 0 4px; display: flex; justify-content: space-between; align-items: center; }
.forklaring p { margin: 0; }
.graf-oppsett { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; }
.grafmeny ul { list-style: none; padding: 0; margin: 0 0 8px; }
.grafmeny a { display: block; padding: 6px 10px; border-radius: 7px; text-decoration: none; color: var(--tekst); font-size: 0.93rem; }
.grafmeny a small { display: block; color: var(--dempet); font-size: 0.78rem; }
.grafmeny a:hover { background: var(--bakgrunn); }
.grafmeny a.aktiv { background: var(--hoved-lys); color: var(--hoved-mork); font-weight: 600; }
.grafmeny h3:first-child { margin-top: 0; }

/* Oppgaver */
.sidevalg { max-height: 260px; overflow: auto; border: 1px solid var(--linje); border-radius: 9px; padding: 6px 10px; }
.avkryss { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; }
.antall { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.antall label { display: flex; flex-direction: column; font-size: 0.9rem; }
.poengsum { font-weight: 600; color: var(--hoved-mork); }
.merke { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--dempet); }
.sporsmal { font-size: 1.06rem; font-weight: 500; }
.alternativer { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.alternativ { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; border: 1px solid var(--linje); border-radius: 9px; cursor: pointer; }
.alternativ:hover { background: var(--bakgrunn); }
.alternativ.er-riktig { background: var(--ok-lys); border-color: var(--ok); }
.alternativ.er-feil { background: var(--fare-lys); border-color: var(--fare); }
.regnesvar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.regnesvar input { max-width: 200px; }
.dom { font-weight: 600; padding: 10px 14px; border-radius: 9px; }
.dom.riktig { background: var(--ok-lys); color: var(--ok-tekst); }
.dom.feil { background: var(--fare-lys); color: var(--fare-tekst); }
.losning { background: var(--bakgrunn); padding: 10px 14px; border-radius: 9px; margin: 10px 0; }
.losning summary, .kriterier summary, .vurdering summary { cursor: pointer; font-weight: 600; }
.losning summary .knapp { margin-left: 8px; }
.kriterier { margin-bottom: 10px; }
.vurdering { border: 1px solid var(--info-kant); background: var(--hoved-lys); border-radius: 10px; padding: 12px 16px; margin-top: 10px; }
.vurdering h4 { margin-top: 0; display: flex; gap: 8px; align-items: center; }
.karakter { background: var(--hoved); color: white; border-radius: 99px; padding: 2px 12px; font-weight: 700; font-size: 0.9rem; }
.modellsvar { white-space: pre-wrap; }
.oppgave textarea { margin-bottom: 8px; }

/* Begreper */
.filterlinje { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px; }
.filterlinje input { flex: 2; min-width: 180px; }
.filterlinje select { flex: 1; min-width: 160px; width: auto; }
.bokstav { color: var(--hoved); border-bottom: 1px solid var(--linje); padding-bottom: 2px; }
.begrep { padding: 14px 18px; margin-bottom: 10px; }
.begrep h3 { margin: 0; }
.begrep p { margin: 6px 0; }
.verktoy { display: flex; gap: 6px; }
.eksempel { color: var(--tekst); background: var(--bakgrunn); padding: 6px 10px; border-radius: 7px; }

/* Flashkort */
.bokser { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
.bokser div { background: var(--kort); border: 1px solid var(--linje); border-radius: 9px; padding: 8px; text-align: center; }
.bokser strong { display: block; font-size: 1.3rem; }
.bokser span { color: var(--dempet); font-size: 0.82rem; }
.flashkort { max-width: 640px; min-height: 260px; margin: 0 auto; background: var(--kort); border: 1px solid var(--linje); border-radius: 16px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.07); display: flex; align-items: center; justify-content: center; text-align: center; padding: 28px; cursor: pointer; }
.flashkort:focus { outline: 2px solid var(--hoved); }
.flashkort h2 { font-size: 1.7rem; }
.flash-knapper { display: flex; justify-content: center; gap: 14px; margin-top: 18px; }
.flash-knapper .knapp { padding: 12px 26px; font-size: 1.05rem; }

/* Høytlesningslinje */
.talelinje {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
  background: #111827; color: white; padding: 10px 16px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
}
.talelinje .knapp.lys { background: transparent; color: white; border-color: #4b5563; }
.tale-fart { display: flex; align-items: center; gap: 6px; font-size: 0.88rem; }
.tale-fart input { width: 110px; accent-color: #60a5fa; }

/* Meldinger */
.melding { position: fixed; top: 70px; left: 50%; transform: translate(-50%, -20px); opacity: 0; transition: all 0.3s; z-index: 30; background: #111827; color: white; padding: 10px 18px; border-radius: 10px; max-width: 90vw; }
.melding.vis { opacity: 1; transform: translate(-50%, 0); }
.melding.ok { background: var(--ok); }
.melding.feil { background: var(--fare); }

/* Mobil / smal skjerm */
@media (max-width: 860px) {
  main { padding: 12px 16px; }
  .topp { padding: 10px 16px; }
  .to-kolonner, .graf-innhold, .graf-resultat, .graf-oppsett { grid-template-columns: minmax(0, 1fr); }
  .statistikk { grid-template-columns: repeat(2, 1fr); }
  .plott { height: 340px; }
  .nokkeltall { font-size: 0.82rem; }
  .nokkeltall th, .nokkeltall td { padding: 4px 5px; }
}

/* Dialoger */
.dialog-bakgrunn { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: grid; place-items: center; z-index: 40; padding: 16px; }
.dialog { background: var(--kort); color: var(--tekst); border-radius: var(--radius); padding: 20px; width: min(460px, 100%); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25); }
.dialog h3 { margin-top: 0; }
.dialog-knapper { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.knapp.fare-fylt { background: var(--fare); }
.knapp.fare-fylt:hover { background: #b91c1c; }
.midt-rad { justify-content: center; }


/* Tilpasning til claude.ai (mobilkanter og systemlinjer) */
.topp { top: env(safe-area-inset-top, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--kort); }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.demo-banner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.talelinje { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); }

</style>

    session_expired: "Du er logget ut av claude.ai. Logg inn igjen og prøv på nytt.",
    image_rejected: "Et av bildene kunne ikke brukes. Prøv et annet bilde (JPG eller PNG).",
    images_unavailable: "Bilder kan ikke sendes til Claude fra denne visningen. Prøv å åpne siden i nettleseren på claude.ai.",
    prompt_too_large: "Det ble for mye tekst på én gang. Velg færre sider.",
    refused: "Claude ville ikke svare på denne forespørselen.",
    invalid_json: "Claude svarte i et format appen ikke forstod. Prøv igjen.",
    empty_completion: "Claude ga et tomt svar. Prøv igjen.",
    cancelled: "Avbrutt."
  };
  function jsonInstruks(skjema) {
    return `

SVARFORMAT: Svar KUN med ett JSON-objekt, uten annen tekst og uten kodeblokk. Objektet skal følge dette JSON-skjemaet nøyaktig (alle felt må være med):
${JSON.stringify(skjema)}`;
  }
  async function spørClaude(prompt, valg = {}) {
    const sample = await bruk("sample");
    if (!sample) throw new Error("Claude er ikke tilgjengelig her. Åpne siden på claude.ai mens du er logget inn.");
    try {
      return await sample.json(prompt, { modelTier: "default", ...valg });
    } catch (e) {
      throw new Error(FEILTEKST[e?.code] || `Noe gikk galt hos Claude (${e?.code || "ukjent feil"}). Prøv igjen.`);
    }
  }
  var liste = (v) => Array.isArray(v) ? v : [];
  var tekst2 = (v) => typeof v === "string" ? v : v == null ? "" : String(v);
  var tall2 = (v, standard = 0) => Number.isFinite(Number(v)) ? Number(v) : standard;
  function rensStartverdier(v) {
    return liste(v).filter((s) => s && typeof s.id === "string").map((s) => ({ id: s.id, verdi: tall2(s.verdi) }));
  }
  function rensAnalyse(a) {
    a = a && typeof a === "object" ? a : {};
    return {
      lesbar: a.lesbar !== false,
      tittel: tekst2(a.tittel) || "Uten tittel",
      sammendrag: tekst2(a.sammendrag),
      hovedpoenger: liste(a.hovedpoenger).map(tekst2).filter(Boolean),
      temaer: liste(a.temaer).filter((t) => TEMA_IDER.includes(t)),
      begreper: liste(a.begreper).filter((b) => b && b.begrep).map((b) => ({
        begrep: tekst2(b.begrep),
        forklaring: tekst2(b.forklaring),
        eksempel: tekst2(b.eksempel),
        tema: TEMA_IDER.includes(b.tema) ? b.tema : null
      })),
      grafer: liste(a.grafer).filter((g) => g && (MAL_IDER.includes(g.mal) || g.mal === "fri" && g.fri && typeof g.fri === "object")).map((g) => ({
        mal: g.mal,
        tittel: tekst2(g.tittel),
        kobling: tekst2(g.kobling),
        startverdier: rensStartverdier(g.startverdier),
        fri: g.mal === "fri" ? {
          xAkse: { navn: tekst2(g.fri.xAkse?.navn), min: tall2(g.fri.xAkse?.min), max: tall2(g.fri.xAkse?.max, 100) },
          yAkse: { navn: tekst2(g.fri.yAkse?.navn), min: tall2(g.fri.yAkse?.min), max: tall2(g.fri.yAkse?.max, 100) },
          parametre: liste(g.fri.parametre).map((p) => ({ id: tekst2(p.id), navn: tekst2(p.navn), min: tall2(p.min), max: tall2(p.max, 10), steg: tall2(p.steg, 1) || 1, start: tall2(p.start) })),
          kurver: liste(g.fri.kurver).map((k) => ({ id: tekst2(k.id), navn: tekst2(k.navn), type: k.type === "loddrett" ? "loddrett" : "y_av_x", uttrykk: tekst2(k.uttrykk) })),
          skjaeringer: liste(g.fri.skjaeringer).map((s) => ({ kurve1: tekst2(s.kurve1), kurve2: tekst2(s.kurve2), navn: tekst2(s.navn) }))
        } : null
      }))
    };
  }
  function rensOppgaver(svar) {
    return liste(svar?.oppgaver).map((o) => {
      if (!o || !["flervalg", "regning", "drofting", "graf"].includes(o.type) || !o.sporsmal) return null;
      const ut = {
        type: o.type,
        tema: TEMA_IDER.includes(o.tema) ? o.tema : "modeller",
        sporsmal: tekst2(o.sporsmal),
        alternativer: liste(o.alternativer).map(tekst2),
        riktigAlternativ: Math.round(tall2(o.riktigAlternativ, -1)),
        fasitTall: tall2(o.fasitTall),
        enhet: tekst2(o.enhet),
        toleranse: Math.abs(tall2(o.toleranse)),
        losningsforslag: tekst2(o.losningsforslag),
        vurderingskriterier: liste(o.vurderingskriterier).map(tekst2),
        graf: null
      };
      if (ut.type === "flervalg" && (ut.alternativer.length < 2 || ut.riktigAlternativ < 0 || ut.riktigAlternativ >= ut.alternativer.length)) return null;
      if (ut.type === "graf") {
        const g = o.graf;
        const mal = g && MALER[g.mal];
        if (!mal || !mal.parametre.some((p) => p.id === g.riktigParameter)) return null;
        ut.graf = { mal: g.mal, startverdier: rensStartverdier(g.startverdier), riktigParameter: g.riktigParameter, riktigRetning: g.riktigRetning === "ned" ? "ned" : "opp" };
      }
      return ut;
    }).filter(Boolean);
  }
  function base64TilBlob(data, type) {
    const bin = atob(data);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type });
  }
  settTransport({
    async status() {
      return { demo: false, artifact: true, lagring: lagringsType };
    },
    async post(url, data) {
      if (url === "/api/analyser") {
        const sample = await bruk("sample");
        if (!sample) throw new Error("Claude er ikke tilgjengelig her. Åpne siden på claude.ai mens du er logget inn.");
        const grenser = await sample.limits().catch(() => null);
        if (!grenser?.images) throw new Error(FEILTEKST.images_unavailable);
        const bilder = data.filer.map((f) => base64TilBlob(f.data, f.type));
        if (bilder.length > grenser.images.maxCount) {
          throw new Error(`Claude kan lese maks ${grenser.images.maxCount} bilder om gangen her. Del opp i flere innleveringer.`);
        }
        const prompt = `${FELLES}

Bildene som følger med, er sider fra læreboka eller notatene mine.

${analyseTekst(bilder.length, tekst2(data.notat).slice(0, 1e3))}${jsonInstruks(ANALYSE_SKJEMA)}`;
        return { analyse: rensAnalyse(await spørClaude(prompt, { images: bilder })) };
      }
      if (url === "/api/oppgaver") {
        const prompt = `${FELLES}

${oppgaveTekst(tekst2(data.kontekst).slice(0, 15e4), data.antall, data.nivå)}${jsonInstruks(OPPGAVE_SKJEMA)}`;
        const oppg = rensOppgaver(await spørClaude(prompt, { cache: false }));
        if (!oppg.length) throw new Error("Claude laget ingen gyldige oppgaver. Prøv igjen.");
        return { oppgaver: oppg };
      }
      if (url === "/api/vurder") {
        if (!tekst2(data.svar).trim()) throw new Error("Skriv et svar først.");
        const prompt = `${FELLES}

${vurderingTekst({ ...data, svar: tekst2(data.svar).slice(0, 3e4) })}${jsonInstruks(VURDERING_SKJEMA)}`;
        const v = await spørClaude(prompt);
        return {
          tilbakemelding: tekst2(v?.tilbakemelding),
          styrker: liste(v?.styrker).map(tekst2),
          forbedringer: liste(v?.forbedringer).map(tekst2),
          karakter: Math.min(6, Math.max(1, Math.round(tall2(v?.karakter, 3)))),
          modellsvar: tekst2(v?.modellsvar)
        };
      }
      throw new Error(`Ukjent forespørsel: ${url}`);
    }
  });
  var ClaudeTale = class extends NettleserTale {
    constructor(tts, språk) {
      super();
      this.tts = tts;
      this.språk = språk;
      this.navn = "Claudes stemme";
      tts.onState(({ state }) => {
        this.status = state === "idle" ? "stoppet" : state === "paused" ? "pause" : "spiller";
        this.vedEndring();
      });
    }
    støttes() {
      return true;
    }
    stemmer() {
      return [];
    }
    velgStemme() {
      return null;
    }
    fart() {
      return Math.min(1.5, Math.max(0.7, this.hastighet));
    }
    les(tekstSomLeses) {
      const linjer = this.delOpp(tekstSomLeses).map((t) => ({ text: t.trim(), ...this.språk ? { language: this.språk } : {} })).filter((l) => l.text);
      this.status = "spiller";
      this.vedEndring();
      this.tts.speak(linjer, { rate: this.fart() }).catch((e) => {
        if (e?.code === "not_granted") melding("Høytlesning er slått av for denne siden.");
      });
    }
    pause() {
      this.tts.pause().catch(() => {
      });
    }
    fortsett() {
      this.tts.resume().catch(() => {
      });
    }
    stopp() {
      if (this.tts.active?.()) this.tts.stop().catch(() => {
      });
      this.status = "stoppet";
      this.vedEndring();
    }
    settHastighet(h) {
      this.hastighet = h;
      if (this.status !== "stoppet") this.tts.setRate(this.fart()).catch(() => {
      });
    }
  };
  async function velgTalemotor() {
    if ("speechSynthesis" in window && speechSynthesis.getVoices().length === 0) {
      await new Promise((r) => {
        speechSynthesis.addEventListener("voiceschanged", r, { once: true });
        setTimeout(r, 1500);
      });
    }
    const harNorsk = "speechSynthesis" in window && speechSynthesis.getVoices().some((v) => /^(nb|no|nn)([-_]|$)/i.test(v.lang));
    if (harNorsk) return;
    const tts = await bruk("tts");
    if (!tts) return;
    const språk = await tts.languages?.().then((l) => ["nb", "no", "nb-NO"].find((x) => l.includes(x))).catch(() => void 0);
    settTale(new ClaudeTale(tts, språk));
  }
  var linje = document.getElementById("talelinje");
  var pauseKnapp = document.getElementById("tale-pause");
  var hastighet = document.getElementById("tale-hastighet");
  var hastighetVerdi = document.getElementById("tale-hastighet-verdi");
  var visFart = (h) => {
    hastighetVerdi.textContent = `${h.toLocaleString("nb-NO", { minimumFractionDigits: 1 })}×`;
  };
  function kobleTalelinje() {
    try {
      const lagret = JSON.parse(localStorage.getItem("tale") || "{}");
      if (lagret.hastighet) tale.hastighet = lagret.hastighet;
      if (lagret.stemme) tale.stemmeNavn = lagret.stemme;
    } catch {
    }
    hastighet.value = tale.hastighet;
    visFart(tale.hastighet);
    tale.vedEndring = () => {
      linje.hidden = tale.status === "stoppet";
      pauseKnapp.textContent = tale.status === "pause" ? "▶ Fortsett" : "⏸ Pause";
    };
  }
  pauseKnapp.addEventListener("click", () => tale.status === "pause" ? tale.fortsett() : tale.pause());
  document.getElementById("tale-stopp").addEventListener("click", () => tale.stopp());
  hastighet.addEventListener("input", () => {
    const h = Number(hastighet.value);
    visFart(h);
    tale.settHastighet(h);
    try {
      localStorage.setItem("tale", JSON.stringify({ hastighet: h, stemme: tale.stemmeNavn }));
    } catch {
    }
  });
  kobleTalelinje();
  main.innerHTML = '<div class="laster"><div class="spinner"></div><p>Laster faget ditt …</p></div>';
  (async () => {
    await settOppLagring();
    if (lagringsType !== "claude") document.getElementById("lagring-banner").hidden = false;
    await visRute("/oversikt");
    velgTalemotor().then(kobleTalelinje).catch(() => {
    });
  })();
})();

</script>
